name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cxx: g++
            build_type: Release
            sanitize: ""
          - name: clang-asan-ubsan
            cxx: clang++
            build_type: Debug
            sanitize: address,undefined
          - name: clang-tsan
            cxx: clang++
            build_type: RelWithDebInfo
            sanitize: thread
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Reduce mmap entropy for sanitizers
        if: matrix.sanitize != ''
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLSM_SANITIZE=${{ matrix.sanitize }}
          -DLSM_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: |
          if [ -n "${{ matrix.sanitize }}" ]; then
            # Sanitizer runtimes reject the runner's high-entropy ASLR
            # ("unexpected memory mapping"); run with randomization off.
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure --parallel 4
          else
            ctest --test-dir build --output-on-failure --parallel 4
          fi

  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DLSM_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
